<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva de Canchas</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>Reserva de Canchas</h1>
        <a class="admin-link" href="/admin.html">Administración</a>
      </header>

      <main class="container">
        <section class="card">
          <h2>Nueva reserva</h2>
          <form id="booking-form">
            <label>
              Cédula
              <input type="text" id="cedula" placeholder="Ej: 45678912" required />
            </label>

            <label>
              Día
              <select id="date-select" required></select>
            </label>

            <label>
              Cancha
              <select id="court-select" required></select>
            </label>

            <label>
              Horario
              <select id="slot-select" required disabled>
                <option value="">Elegí primero cancha y día</option>
              </select>
            </label>

            <button type="submit">Reservar</button>
          </form>
          <p id="booking-message" class="message"></p>
        </section>

        <section class="card">
          <h2>Cancelar una reserva</h2>
          <form id="lookup-form">
            <label>
              Cédula
              <input type="text" id="lookup-cedula" placeholder="Ej: 45678912" required />
            </label>
            <button type="submit">Buscar mis reservas</button>
          </form>
          <div id="my-reservations"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
